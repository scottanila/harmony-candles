<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boutique — Harmony Candles</title>
  <meta name="description" content="Toutes les créations parfumées Harmony Candles : fondants, brûle-parfums, bouquets en cire, parfums d'intérieur, diffuseurs voiture et coffrets cadeaux.">
  <meta name="theme-color" content="#f6eee4">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/pages.css">
</head>
<body class="is-loading" data-page="boutique">
  <div data-layout="header"></div>

  <main>
    <section class="shop-head" id="top" data-shop-head>
      <div>
        <p class="label" data-intro>Notre boutique</p>
        <h1 class="h-display shop__title" data-intro>Toute la <em>boutique</em></h1>
        <p class="lead shop__desc" data-intro></p>
      </div>
      <div class="shop__visual" data-intro aria-hidden="true"></div>
    </section>

    <div class="shop-bar">
      <div class="chips" data-chips role="group" aria-label="Filtrer par collection"></div>
      <div class="shop-bar__right">
        <span class="label" data-count aria-live="polite"></span>
        <label class="select"><span class="sr-only">Trier les produits</span>
          <select data-sort>
            <option value="">Notre sélection</option>
            <option value="asc">Prix croissant</option>
            <option value="desc">Prix décroissant</option>
          </select>
        </label>
      </div>
    </div>

    <section class="grid" data-grid aria-label="Produits"></section>
  </main>

  <div data-layout="footer"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/pages.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
