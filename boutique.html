<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boutique — Harmony Candles</title>
  <meta name="description" content="Toutes les créations parfumées Harmony Candles : fondants, brûle-parfums, bouquets, parfums d’intérieur et coffrets.">
  <link rel="icon" href="assets/img/logo-ink.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Inter:wght@200;300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script>
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('anim');
    setTimeout(function () { if (!window.gsap) document.documentElement.classList.remove('anim'); }, 4000);
  </script>
</head>
<body data-page="boutique">
  <div data-layout="header"></div>
  <main>
    <section class="page-head">
      <div class="wrap wrap--wide shop-intro">
        <div>
          <p class="label">La boutique · <span data-shop-count></span></p>
          <h1 class="display" data-hero data-shop-title>Toute la <em>boutique</em></h1>
        </div>
        <p class="shop-intro__desc" data-shop-desc data-fade></p>
      </div>
    </section>
    <section class="wrap wrap--wide" data-shop style="padding-bottom:140px">
      <nav class="filters" aria-label="Filtrer par collection"></nav>
      <div class="grid"></div>
    </section>
  </main>
  <div data-layout="footer"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/pages.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
